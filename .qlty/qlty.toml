config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


# gofmt and golangci-lint are already the CI gates (make lint); osv-scanner
# covers both module trees. Everything else here is what the Go/Go+Astro
# toolchain does not check on its own.
[[plugin]]
name = "actionlint"

[[plugin]]
name = "golangci-lint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-go"

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "zizmor"

# Duplicated literals: the CLI tests are deliberately table-driven and literal
# (flag names, expected messages), so triage them down instead of hoisting
# every string into a constant. Production files still report at full level.
[[triage]]
match.rules = ["radarlint-go:go:S1192"]
match.file_patterns = ["**/*_test.go"]
set.level = "low"

# Test functions are long by nature: one table, many assertions. Complexity is
# a production-code signal, so demote it for tests only.
[[triage]]
match.rules = ["radarlint-go:go:S3776"]
match.file_patterns = ["**/*_test.go"]
set.level = "low"
